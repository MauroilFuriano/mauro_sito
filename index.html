<!DOCTYPE html>
<html lang="it" class="avvio-home">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, shrink-to-fit=no, viewport-fit=cover" />
  <meta name="author" content="Mauro Ceccarelli" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/logo-64.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <script>
    if (location.pathname === '/') document.documentElement.classList.add('avvio-home');
    var temaSalvato = null;
    try {
      temaSalvato = localStorage.getItem('tema');
    } catch (erroreArchivio) {}
    document.documentElement.dataset.tema = temaSalvato === 'chiaro' || temaSalvato === 'scuro'
      ? temaSalvato
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro');
  </script>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
    try {
      if (localStorage.getItem('cookie_consent') && localStorage.getItem('cookie_versione') === '2026-10-04') {
        var consensoMarketing = localStorage.getItem('cookie_marketing') === 'true' ? 'granted' : 'denied';
        gtag('consent', 'update', {
          analytics_storage: localStorage.getItem('cookie_analytics') === 'true' ? 'granted' : 'denied',
          ad_storage: consensoMarketing,
          ad_user_data: consensoMarketing,
          ad_personalization: 'denied'
        });
      }
    } catch (erroreArchivio) {}
  </script>

</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
