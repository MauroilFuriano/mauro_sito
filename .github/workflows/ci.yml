name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    name: Tipi e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Node.js come su Vercel
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Installazione delle dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npx tsc --noEmit

      - name: Build di produzione
        run: npm run build

      - name: Audit delle dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
