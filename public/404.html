<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina non trovata | Mauro.exe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --carta: #F6F6F3; --inchiostro: #141414; --grafite: #55554F; --cobalto: #2347E6; }
    @media (prefers-color-scheme: dark) {
      :root { --carta: #121212; --inchiostro: #F1F1EC; --grafite: #A9A9A1; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--carta); color: var(--inchiostro); font-family: "Segoe UI", system-ui, sans-serif; text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 12px; }
    p { color: var(--grafite); margin: 0 0 28px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--cobalto); color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--inchiostro); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Pagina non trovata</h1>
    <p>L'indirizzo che hai aperto non esiste o è stato spostato.</p>
    <a href="/">Torna alla home</a>
  </main>
</body>
</html>
